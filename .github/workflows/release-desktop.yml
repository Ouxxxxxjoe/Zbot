# release-desktop.yml — Zbot 内部使用:打未签名安装包,不做 OSS 分发。
#
# 与 ci.yml(client-ci,只管测试/静态检查)不同,本 workflow 真正产出可分发安装包:
#   - 用真实 Electron 二进制(不设 ci.yml 的 ELECTRON_SKIP_BINARY_DOWNLOAD / stub);
#   - 显式 --version(避免读线上 CDN manifest 取基线,内部无更新源);
#   - --no-sign:跳过 Windows / macOS 签名(内部使用,无需签名/公证);
#   - ZBOT_DISABLE_AUTO_UPDATE=1:构建期经 vite define 烘焙,整体关闭应用内自动更新
#     (手动分发安装包,不依赖 OSS/CDN 更新源)。
#
# ⚠️ 这是给内部使用的起点,首次在 GitHub 上跑可能需要微调:
#   - 原生模块(better-sqlite3 / node-pty / sharp)在 runner 上重建较慢,个别需
#     pnpm approve-builds / rebuild; macOS 首次还要装 Xcode 工具链。
#   - 若需 macOS 公证 / Windows 签名,再加对应 secrets(本 workflow 刻意不加)。
#   - agent 二进制(claude/codex/ripgrep/pi)由 postinstall 按需拉取;若被网络拦截
#     可改用 `pnpm install:agent-binaries` 显式安装或缓存。

name: release-desktop-installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (e.g. 0.1.0). Explicit version => no CDN baseline read.'
        required: true
        default: '0.1.0'
      region:
        description: 'Build region'
        required: true
        default: 'cn'

permissions:
  contents: read

env:
  CINDY_AUTH_REGION: ${{ inputs.region }}
  ZBOT_DISABLE_AUTO_UPDATE: '1'
  ZBOT_ENABLE_MOBILE_AUTOMATION: '0'
  # fork 后仓体变大,desktop 打包(tsc/electron-forge)峰值内存突破 Node 默认
  # 上限会 OOM(与 ci.yml 的 typecheck 同款);公开 runner 16GB 内存,8GB 安全。
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  build-macos:
    name: Build macOS (.dmg, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (full — real Electron + native modules)
        run: pnpm install

      - name: Prepare release-regions config (empty OSS/signing — internal only)
        run: |
          mkdir -p apps/desktop/scripts
          cat > apps/desktop/scripts/release-regions.json <<'EOF'
          {
            "cn": {
              "oss": { "cdnBaseUrl": "", "bucket": "", "prefix": "", "ossRegion": "" },
              "macSigning": { "appleId": "", "teamId": "", "signIdentity": "", "appPasswordEnv": "" }
            }
          }
          EOF

      # config/log-upload.json 被 .gitignore 忽略(真值在外部构建仓),内部测试包
      # 不打真实日志;放占位目标满足 log-upload-build-env 的硬校验(project/logstore
      # 跨区互不相同),烘焙进包的地址指向内部占位 SLS。
      - name: Prepare log-upload config (internal placeholder — no real telemetry)
        run: |
          mkdir -p config
          cat > config/log-upload.json <<'EOF'
          {
            "schemaVersion": 1,
            "cn": {
              "project": "zbot-internal-cn",
              "logstore": "zbot-internal-cn-client-log",
              "slsRegion": "cn-shanghai"
            },
            "global": {
              "project": "zbot-internal-global",
              "logstore": "zbot-internal-global-client-log",
              "slsRegion": "ap-southeast-1"
            },
            "dev": null
          }
          EOF

      - name: Package (.dmg, unsigned, versioned, auto-update off)
        run: pnpm release:package --region ${{ inputs.region }} --no-sign --version ${{ inputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: zbot-installers-macos-${{ inputs.version }}
          path: release/artifacts/${{ inputs.region }}/${{ inputs.version }}/darwin-arm64/**
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe, unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (full — real Electron + native modules)
        run: pnpm install

      - name: Prepare release-regions config (empty OSS/signing — internal only)
        shell: bash
        run: |
          mkdir -p apps/desktop/scripts
          cat > apps/desktop/scripts/release-regions.json <<'EOF'
          {
            "cn": {
              "oss": { "cdnBaseUrl": "", "bucket": "", "prefix": "", "ossRegion": "" },
              "macSigning": { "appleId": "", "teamId": "", "signIdentity": "", "appPasswordEnv": "" }
            }
          }
          EOF

      # config/log-upload.json 被 .gitignore 忽略(真值在外部构建仓),内部测试包
      # 不打真实日志;放占位目标满足 log-upload-build-env 的硬校验(project/logstore
      # 跨区互不相同),烘焙进包的地址指向内部占位 SLS。
      - name: Prepare log-upload config (internal placeholder — no real telemetry)
        shell: bash
        run: |
          mkdir -p config
          cat > config/log-upload.json <<'EOF'
          {
            "schemaVersion": 1,
            "cn": {
              "project": "zbot-internal-cn",
              "logstore": "zbot-internal-cn-client-log",
              "slsRegion": "cn-shanghai"
            },
            "global": {
              "project": "zbot-internal-global",
              "logstore": "zbot-internal-global-client-log",
              "slsRegion": "ap-southeast-1"
            },
            "dev": null
          }
          EOF

      - name: Package (.exe, unsigned, versioned, auto-update off)
        shell: bash
        run: pnpm release:package --region ${{ inputs.region }} --no-sign --version ${{ inputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: zbot-installers-windows-${{ inputs.version }}
          path: release/artifacts/${{ inputs.region }}/${{ inputs.version }}/win32-x64/**
          if-no-files-found: error
